# 커밋과 PR에서 타입, 도메인 테스트, 운영 빌드를 검증한다.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prisma Client는 생성물이라 저장소에 없다(server/.gitignore). 만들지 않으면
      # prisma.ts가 모듈을 못 찾아 타입 검사 전체가 실패한다. 운영 이미지의 Dockerfile도 같은 단계를 거친다.
      - run: npx prisma generate
        working-directory: server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
